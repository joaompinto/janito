name: Publish a release
on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v2.1.3

jobs:
  build-n-publish:
    name: Build and publish Python 🐍 distributions 📦 to PyPI
    # Pinned instead of `ubuntu-latest`: the floating label migrates to
    # Ubuntu 26.04 starting 2026-10-19 (actions/runner-images#14748), and a
    # release/publish pipeline should not track a moving OS baseline.
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: write  # Required to create GitHub releases
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Required for setuptools_scm to determine version from git tags

      - name: Set up Python for changelog check
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Verify CHANGELOG.md documents this release
        env:
          # e.g. "v4.12.0" from the pushed tag; the check requires a matching
          # "## [v4.12.0]" section (a bare "[Unreleased]" is not enough).
          CHANGELOG_REQUIRE_VERSION: ${{ github.ref_name }}
        run: python scripts/check_changelog_freshness.py

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: python scripts/extract_changelog_section.py "$TAG_NAME" --output release-notes.md

      - name: Build a binary wheel and a source tarball
        run: uv build --python 3.10

      - name: Publish distribution 📦 to PyPI
        if: startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          body_path: release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: false
