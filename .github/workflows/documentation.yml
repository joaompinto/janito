name: Documentation
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pinned instead of `ubuntu-latest`: the floating label migrates to
    # Ubuntu 26.04 starting 2026-10-19 (actions/runner-images#14748).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uvx zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
